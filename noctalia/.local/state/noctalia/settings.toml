config_version = 14

[audio]
enable_overdrive = true

[bar.default]
end = [ "recorder", "battery", "bluetooth", "network", "volume", "brightness", "clipboard", "notifications", "tray" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
shadow = false
start = [ "session", "workspaces" ]
widget_spacing = 13

[brightness]
enable_ddcutil = true
minimum_brightness = 0.0099999997764825821

[calendar]
enabled = true

[control_center.calendar]
show_events_card = false
show_week_numbers = true

[location]
address = "Ljubljana"
custom_schedule = true
sunrise = "06:30"
sunset = "22:00"

[lockscreen]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
max_visible = 4

[plugin_settings."noctalia/screen_recorder"]
audio_source = "both"
glyph_idle = "camera"
glyph_pending = "camera-cog"
glyph_recording = "camera-check"
glyph_replaying = "camera-rotate"
glyph_unavailable = "camera-off"
replay_duration = 300
replay_enabled = true
restore_portal = true
video_qp = 10
video_source = "focused"

[shell]
lang = "en"

[theme]
builtin = "Gruvbox"
shell_mode = "dark"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/nix/store/6c40hhhkl4n4qaj96hql18a4n9gakg7c-noctalia-5.0.1/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/nix/store/6c40hhhkl4n4qaj96hql18a4n9gakg7c-noctalia-5.0.1/share/noctalia/assets/noctalia-wallpaper.png"

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%H:%M}    {:%Y-%m-%d}"

[widget.network]
show_label = false

    [widget.network.actions]
    right = "none"

[widget.recorder]
enable_scroll = false
type = "noctalia/screen_recorder:recorder"

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.workspaces]
empty_color = "primary"
occupied_color = "primary"
show_labels = false