##### GENERAL #####
save-position-on-quit
msg-color=yes # color log messages on terminal
term-osd-bar=yes # displays a progress bar on the terminal
cursor-autohide=1000 # autohides the cursor after 1s

##### OSD #####
osd-on-seek=msg-bar
osd-color='#CCFFFFFF'         # ARGB format
osd-border-color='#DD322640'  # ARGB format
osd-border-size=0.5           # size for osd text and progress bar
osd-bar-w=60

##### HARDWARE DECODING #####
hwdec=auto-copy
vo=gpu-next
gpu-api=vulkan
gpu-context=auto
profile=high-quality
deband=no
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32
temporal-dither=yes

##### VOLUME #####
volume=100
volume-max=150

##### CACHE #####
cache=yes
cache-secs=300

##### AUDIO & SUBTITLES #####
blend-subtitles=yes
slang=en,eng,English
alang=ja,jp,jpn,jap,Japanese,en,eng,English

##### MOTION INTERPOLATION #####
# override-display-fps=60
# video-sync=display-resample
# interpolation=yes
# tscale=oversample # smoothmotion

#HDR passtrough: Important for HDR & DoVi playback, no downside for SDR so always on
target-colorspace-hint=yes
